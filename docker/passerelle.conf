# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ LA PASSERELLE SUPABASE — trois préfixes, et rien d'autre.                ║
# ║                                                                          ║
# ║ Ce fichier remplace Kong, qui n'apporterait ici qu'un dixième service et ║
# ║ un fichier de déclaration de routes. Ce qu'il faisait d'utile tient en   ║
# ║ trois `location`.                                                        ║
# ║                                                                          ║
# ║ ⚠️ LA BARRE FINALE DE `proxy_pass` EST LA PIÈCE ESSENTIELLE.             ║
# ║ gotrue, PostgREST et storage-api servent tous leurs routes À LA RACINE : ║
# ║ `/token`, `/rpc/...`, `/object/...`. La barre finale RETIRE le préfixe.  ║
# ║ Sans elle, gotrue recevrait `/auth/v1/token` et répondrait 404 — un 404  ║
# ║ qui ressemble à une route absente, pas à une erreur de configuration.    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

server {
    listen 8000;
    server_name _;

    # L'application dépose les sources (100 Mo) et les copies filigranées
    # (jusqu'à 200 Mo). Nginx plafonne à 1 Mo par défaut : sans cette ligne,
    # chaque dépôt réel échoue.
    client_max_body_size 200m;

    # Le rendu d'un conte et la première génération d'un filigrane prennent
    # plusieurs dizaines de secondes.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── L'authentification ──────────────────────────────────────────────────
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
    }

    # ── L'API de données ────────────────────────────────────────────────────
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
    }

    # ── Les fichiers ────────────────────────────────────────────────────────
    location /storage/v1/ {
        proxy_pass http://storage:5000/;
    }

    # ── Les gabarits d'email à CODE ─────────────────────────────────────────
    #
    # gotrue ne lit pas un fichier local : il TÉLÉCHARGE le gabarit par son
    # URL, au moment d'envoyer. Ces deux fichiers sont donc servis, en lecture
    # seule, et ils n'ont rien de secret — ils ne contiennent que la mise en
    # forme ; le code à six chiffres y est injecté par gotrue.
    location /modeles-email/ {
        alias /srv/modeles-email/;
        default_type text/html;
    }

    # ── Tout le reste ───────────────────────────────────────────────────────
    #
    # Ni Studio, ni postgres-meta (`/pg/`), ni les fonctions : ils donnent la
    # main sur la base. 404, et non 403 — « vous n'avez pas accès »
    # confirmerait qu'il y a quelque chose à cette adresse.
    location / {
        return 404;
    }
}
