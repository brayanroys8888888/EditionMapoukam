# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ ÉDITION MAPOUKAM — la pile complète, en un fichier.                      ║
# ║                                                                          ║
# ║ Huit services, trois réseaux logiques, et une seule règle de publication ║
# ║ de ports : RIEN n'écoute sur 0.0.0.0. Docker écrit ses propres règles    ║
# ║ iptables et CONTOURNE ufw — un port publié par un conteneur est ouvert   ║
# ║ sur Internet même si le pare-feu le bloque. Tout est donc lié à          ║
# ║ 127.0.0.1, et c'est Nginx, sur l'hôte, qui décide de ce qui sort         ║
# ║ (docs/HEBERGEMENT-VPS.md §7).                                            ║
# ║                                                                          ║
# ║   Internet ─► Nginx de l'hôte :443                                       ║
# ║                ├─ DOMAINE     ─► app          127.0.0.1:3000            ║
# ║                └─ api.DOMAINE ─► passerelle   127.0.0.1:8000            ║
# ║                                   ├─ /auth/v1    ─► auth    (gotrue)    ║
# ║                                   ├─ /rest/v1    ─► rest    (PostgREST) ║
# ║                                   └─ /storage/v1 ─► storage             ║
# ║                                                                          ║
# ║ Démarrage :  cp .env.docker.example .env                                 ║
# ║              node docker/generer-cles.mjs >> .env                        ║
# ║              docker compose up -d --build                                ║
# ║              docker compose --profile migrations up migrations           ║
# ║                                                                          ║
# ║ Le détail, y compris pourquoi ce fichier existe À CÔTÉ de la composition ║
# ║ officielle de Supabase, est dans docs/DOCKER.md.                         ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: editionmapoukam

services:
  # ───────────────────────────────────────────────────────────────────────────
  # LA BASE — PostgreSQL 17, par l'image de Supabase.
  #
  # `supabase/postgres` et non `postgres:17` : elle embarque les rôles
  # (`anon`, `authenticated`, `service_role`, `supabase_auth_admin`,
  # `supabase_storage_admin`) et les extensions que les migrations du dépôt
  # supposent présentes. Sur une image PostgreSQL nue, la migration 0001
  # échoue.
  # ───────────────────────────────────────────────────────────────────────────
  db:
    image: ${IMAGE_POSTGRES}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      # ┌──────────────────────────────────────────────────────────────────┐
      # │ AUCUN `POSTGRES_USER` ICI, ET C'EST LA CONDITION DU DÉMARRAGE.   │
      # │                                                                  │
      # │ L'image `supabase/postgres` initialise son cluster avec          │
      # │ `supabase_admin` comme superutilisateur, et son `migrate.sh` —   │
      # │ celui qui crée `authenticator`, `supabase_auth_admin`,           │
      # │ `supabase_storage_admin`, `anon`, `service_role` — s'y connecte  │
      # │ sous ce nom. Poser `POSTGRES_USER=postgres` écrase ce défaut :   │
      # │ `initdb` crée alors `postgres`, et `migrate.sh` échoue aussitôt  │
      # │ sur `role "supabase_admin" does not exist`.                      │
      # │                                                                  │
      # │ La base démarre malgré tout, et se déclare même SAINE — mais     │
      # │ elle est nue. Les migrations du projet échouent, et auth, rest   │
      # │ et storage redémarrent en boucle faute de leurs rôles. Aucun de  │
      # │ ces messages ne parle du superutilisateur.                       │
      # │                                                                  │
      # │ La composition officielle de Supabase ne pose pas cette variable │
      # │ non plus. Le rôle `postgres`, lui, est créé par `migrate.sh`.    │
      # │ Mesuré le 23 septembre 2026.                                     │
      # └──────────────────────────────────────────────────────────────────┘
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=/var/run/postgresql
      - POSTGRES_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXP=${JWT_EXPIRY}
    volumes:
      # ┌──────────────────────────────────────────────────────────────────┐
      # │ DANS `init-scripts/`, ET NON À LA RACINE.                        │
      # │                                                                  │
      # │ La racine de `/docker-entrypoint-initdb.d/` est traitée par      │
      # │ PostgreSQL lui-même, par ordre alphabétique et AVANT que         │
      # │ `migrate.sh` n'ait créé les rôles — ces deux fichiers, qui ne    │
      # │ font que poser des mots de passe et des réglages, échouaient     │
      # │ donc sur des rôles inexistants.                                  │
      # │                                                                  │
      # │ `migrate.sh` traite lui-même `init-scripts/` et `migrations/`,   │
      # │ au bon moment et avec les privilèges voulus. C'est exactement    │
      # │ là que la composition officielle de Supabase monte ses propres   │
      # │ `roles.sql` et `jwt.sql` — mêmes fichiers, même rôle.            │
      # └──────────────────────────────────────────────────────────────────┘
      - ./docker/db-init/01-roles.sql:/docker-entrypoint-initdb.d/init-scripts/98-roles.sql:ro
      - ./docker/db-init/02-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - donnees-db:/var/lib/postgresql/data
    ports:
      # Pour `psql`, `pg_dump` et les scripts du dépôt. Jamais pour l'application :
      # elle parle à la base par l'API, jamais en direct.
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      # La PREMIÈRE initialisation joue une centaine de migrations internes à
      # l'image, et dure bien plus que les cent secondes des essais suivants.
      # Sans ce délai de grâce, Compose déclarait la base « unhealthy » et
      # refusait de démarrer les quatre services qui en dépendent — alors
      # qu'elle finissait de s'initialiser normalement.
      start_period: 120s
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # L'AUTHENTIFICATION — gotrue.
  #
  # Les deux gabarits d'email sont l'affaire sensible : ceux de gotrue ne
  # portent qu'un LIEN, dont le jeton vit dans le fragment de l'URL et
  # n'atteint donc jamais le serveur. Les écrans de confirmation et de mot de
  # passe oublié du projet attendent un CODE À SIX CHIFFRES, saisi dans un
  # formulaire rendu côté serveur. Sans ces deux URL, l'inscription est une
  # impasse — et rien dans les journaux ne le dit.
  # ───────────────────────────────────────────────────────────────────────────
  auth:
    image: ${IMAGE_GOTRUE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=${SUPABASE_PUBLIC_URL}
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      - GOTRUE_SITE_URL=${APP_PUBLIC_URL}
      - GOTRUE_URI_ALLOW_LIST=${AUTH_REDIRECTIONS_AUTORISEES}
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_EXP=${JWT_EXPIRY}
      - GOTRUE_JWT_SECRET=${JWT_SECRET}

      # Le compte porte une bibliothèque achetée et des moyens de paiement :
      # dix caractères, et non les six par défaut. La règle est DOUBLÉE côté
      # application par un schéma Zod, pour que le refus soit expliqué en
      # français — mais c'est celle-ci qui fait autorité.
      - GOTRUE_PASSWORD_MIN_LENGTH=10
      - GOTRUE_PASSWORD_REQUIRED_CHARACTERS=

      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_MAILER_AUTOCONFIRM=${AUTH_CONFIRMATION_AUTOMATIQUE:-false}
      - GOTRUE_MAILER_OTP_LENGTH=6
      - GOTRUE_MAILER_OTP_EXP=3600
      - GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED=true
      - GOTRUE_MAILER_TEMPLATES_CONFIRMATION=${SUPABASE_PUBLIC_URL}/modeles-email/confirmation.html
      - GOTRUE_MAILER_TEMPLATES_RECOVERY=${SUPABASE_PUBLIC_URL}/modeles-email/recovery.html
      - GOTRUE_MAILER_SUBJECTS_CONFIRMATION=Confirmez votre adresse — Édition Mapoukam
      - GOTRUE_MAILER_SUBJECTS_RECOVERY=Réinitialiser votre mot de passe — Édition Mapoukam

      - GOTRUE_SMTP_HOST=${SMTP_HOST}
      - GOTRUE_SMTP_PORT=${SMTP_PORT}
      - GOTRUE_SMTP_USER=${SMTP_USER}
      - GOTRUE_SMTP_PASS=${SMTP_PASS}
      - GOTRUE_SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL}
      - GOTRUE_SMTP_SENDER_NAME=Édition Mapoukam
      - GOTRUE_SMTP_MAX_FREQUENCY=60s
      - GOTRUE_RATE_LIMIT_EMAIL_SENT=30

      - GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED=true
      - GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL=10

      # Le site n'a ni connexion par téléphone ni session anonyme.
      - GOTRUE_EXTERNAL_PHONE_ENABLED=false
      - GOTRUE_SMS_AUTOCONFIRM=false
      - GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=false

      # Chemin `supabase` d'AUTH_GOOGLE. Sous `desactive` ou `better-auth`,
      # les trois lignes sont inertes : gotrue n'expose le fournisseur que si
      # `ENABLED` vaut true.
      - GOTRUE_EXTERNAL_GOOGLE_ENABLED=${GOOGLE_PAR_SUPABASE:-false}
      - GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOTRUE_EXTERNAL_GOOGLE_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=${SUPABASE_PUBLIC_URL}/auth/v1/callback
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # L'API — PostgREST.
  #
  # Il se connecte en `authenticator`, un rôle qui ne peut RIEN par lui-même :
  # il n'a que le droit de devenir `anon`, `authenticated` ou `service_role`
  # selon le jeton présenté. C'est ce qui fait que RLS s'applique réellement.
  # ───────────────────────────────────────────────────────────────────────────
  rest:
    image: ${IMAGE_POSTGREST}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      - PGRST_DB_SCHEMAS=public,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_DB_EXTRA_SEARCH_PATH=public,extensions
      # Plafond de lignes : le même que `supabase/config.toml` [api] max_rows.
      # Il borne la taille d'une réponse, accidentelle ou malveillante.
      - PGRST_DB_MAX_ROWS=1000
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_APP_SETTINGS_JWT_SECRET=${JWT_SECRET}
      - PGRST_APP_SETTINGS_JWT_EXP=${JWT_EXPIRY}
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # LE STOCKAGE — les quatre buckets.
  #
  # `covers` est public ; `book-sources`, `book-pages` et `book-downloads` sont
  # PRIVÉS, et le restent : aucun fichier de livre n'est jamais servi par une
  # URL publique. L'application passe par une route serveur qui vérifie les
  # droits puis émet une URL signée de 300 secondes (3600 pour un titre
  # gratuit). Ce service ne connaît pas cette règle — il obéit aux jetons.
  # ───────────────────────────────────────────────────────────────────────────
  storage:
    image: ${IMAGE_STORAGE}
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      - ANON_KEY=${ANON_KEY}
      - SERVICE_KEY=${SERVICE_ROLE_KEY}
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      - POSTGREST_URL=http://rest:3000
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=stub
      - REGION=${REGION}
      - GLOBAL_S3_BUCKET=stub

      # ┌────────────────────────────────────────────────────────────────────┐
      # │ 200 Mo, ET CE NOMBRE N'EST PAS DÉCORATIF.                          │
      # │                                                                    │
      # │ La composition officielle de Supabase écrit 50 Mo EN DUR. Les      │
      # │ buckets du projet acceptent 100 Mo (sources PDF) et 200 Mo (copies │
      # │ filigranées) : sous 50, le dépôt d'un gros conte échoue ici alors   │
      # │ qu'il passait en ligne, et le message ne parle pas de taille.       │
      # └────────────────────────────────────────────────────────────────────┘
      - FILE_SIZE_LIMIT=209715200

      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMGPROXY_URL=http://imgproxy:5001
    volumes:
      - fichiers-storage:/var/lib/storage
    restart: always

  # Redimensionnement des images servies par le stockage (les couvertures).
  imgproxy:
    image: ${IMAGE_IMGPROXY}
    environment:
      - IMGPROXY_BIND=:5001
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_ENABLE_WEBP_DETECTION=true
    volumes:
      - fichiers-storage:/var/lib/storage
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # LA PASSERELLE — un seul hôte pour les trois services.
  #
  # Le navigateur y va DIRECTEMENT : les couvertures viennent du bucket
  # public, et les liens de téléchargement sont des URL signées du stockage.
  # C'est pourquoi `api.DOMAINE` doit être public, et pourquoi cette
  # passerelle ne publie QUE trois préfixes. Ni Studio, ni postgres-meta : ils
  # donnent la main sur la base.
  # ───────────────────────────────────────────────────────────────────────────
  passerelle:
    image: nginx:1.27-alpine
    depends_on:
      - auth
      - rest
      - storage
    volumes:
      - ./docker/passerelle.conf:/etc/nginx/conf.d/default.conf:ro
      # Les gabarits à code, que gotrue télécharge PAR URL au moment d'envoyer
      # un email. Servis ici parce que gotrue ne lit pas le disque de l'hôte.
      - ./supabase/templates:/srv/modeles-email:ro
    ports:
      - "127.0.0.1:${PASSERELLE_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          # ┌──────────────────────────────────────────────────────────────┐
          # │ LE NOM PAR LEQUEL L'APPLICATION SE JOINT ELLE-MÊME.          │
          # │                                                              │
          # │ `NEXT_PUBLIC_SUPABASE_URL` sert DEUX publics : le navigateur │
          # │ ET le code serveur, qui tourne dans le conteneur `app`. Le   │
          # │ même nom doit donc résoudre des deux côtés.                  │
          # │                                                              │
          # │ En local, cet alias le fait : `api.mapoukam.localhost`       │
          # │ désigne ce conteneur depuis le réseau Docker, et 127.0.0.1   │
          # │ depuis le navigateur.                                        │
          # │                                                              │
          # │ SUR UN VPS, mettre ici un nom INUTILISÉ (`passerelle.interne`)│
          # │ et laisser le DNS public faire le travail : l'URL y est en   │
          # │ https, et un alias qui la capterait enverrait le conteneur   │
          # │ parler TLS à un port qui n'écoute qu'en clair.               │
          # └──────────────────────────────────────────────────────────────┘
          - ${SUPABASE_ALIAS_INTERNE:-api.mapoukam.localhost}
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # L'APPLICATION — Next.js 16.
  #
  # Les quatre `args` du build ne sont pas une redite des `environment` :
  # une variable `NEXT_PUBLIC_*` est FIGÉE AU BUILD, recopiée dans le code
  # envoyé aux navigateurs. En changer une impose de reconstruire — un simple
  # redémarrage ne suffit pas, et ne proteste pas.
  # ───────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_PUBLIC_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
        - NEXT_PUBLIC_APP_URL=${APP_PUBLIC_URL}
        - NEXT_PUBLIC_DESIGN_VERSION=${NEXT_PUBLIC_DESIGN_VERSION:-v2}
    image: editionmapoukam/app:${APP_VERSION:-local}
    depends_on:
      - passerelle
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_PUBLIC_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
      - NEXT_PUBLIC_APP_URL=${APP_PUBLIC_URL}
      - NEXT_PUBLIC_DESIGN_VERSION=${NEXT_PUBLIC_DESIGN_VERSION:-v2}

      # La clé de service ne quitte JAMAIS le serveur, et jamais sous un nom
      # `NEXT_PUBLIC_*`. L'application refuse de démarrer si elle l'y trouve.
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}

      # Exigé même en production : sans lui, le démarrage échoue. C'est ce qui
      # signe les webhooks du faux prestataire, dont la VÉRIFICATION est bien
      # réelle.
      - FAKE_WEBHOOK_SECRET=${FAKE_WEBHOOK_SECRET}

      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-fake}
      - NOTCHPAY_PUBLIC_KEY=${NOTCHPAY_PUBLIC_KEY}
      - NOTCHPAY_PRIVATE_KEY=${NOTCHPAY_PRIVATE_KEY}
      - NOTCHPAY_HASH_KEY=${NOTCHPAY_HASH_KEY}
      - NOTCHPAY_AUTORISER_PRODUCTION=${NOTCHPAY_AUTORISER_PRODUCTION:-false}

      # `file` n'envoie RIEN : il écrit dans .mails. En ligne, c'est `resend`.
      - MAILER=${MAILER:-file}
      - MAIL_OUTPUT_DIR=/app/.mails
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}

      - AUTH_GOOGLE=${AUTH_GOOGLE:-desactive}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - AUTH_CONFIRMATION_AUTOMATIQUE=${AUTH_CONFIRMATION_AUTOMATIQUE:-false}

      # Plafonds durs, réappliqués dans le code : une valeur supérieure est
      # ramenée au plafond plutôt que servie.
      - SIGNED_URL_TTL=${SIGNED_URL_TTL:-300}
      - SIGNED_URL_TTL_FREE=${SIGNED_URL_TTL_FREE:-3600}
      - EXCERPT_PAGES_DEFAULT=${EXCERPT_PAGES_DEFAULT:-3}
      - ANON_PAGE_RATE_LIMIT=${ANON_PAGE_RATE_LIMIT:-60}
      - PAYMENT_GRACE_PERIOD_DAYS=${PAYMENT_GRACE_PERIOD_DAYS:-7}
      - INVOICE_RETENTION_YEARS=${INVOICE_RETENTION_YEARS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Pour les SCRIPTS seulement (purge des factures, création d'un
      # administrateur). L'application, elle, ne l'ouvre jamais.
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - emails-simules:/app/.mails
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # LES MIGRATIONS — sur demande, jamais au démarrage.
  #
  #   docker compose --profile migrations up migrations
  #
  # Hors profil : un redémarrage de la pile ne doit pas toucher au schéma.
  # Les 87 fichiers sont appliqués DANS L'ORDRE DU NOM, une seule fois
  # chacun, et enregistrés dans `supabase_migrations.schema_migrations` —
  # la même table que celle du CLI Supabase, pour que les deux chemins
  # s'accordent sur ce qui est déjà passé.
  #
  # ⚠️ Ce service n'exécute PAS `seed.sql`. Le jeu de démonstration écrit dix
  # contes fictifs et des comptes d'essai ; c'est un outil de développement.
  # ───────────────────────────────────────────────────────────────────────────
  migrations:
    profiles: ["migrations"]
    image: ${IMAGE_POSTGRES}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/appliquer-migrations.sh:/appliquer-migrations.sh:ro
    entrypoint: ["/bin/bash", "/appliquer-migrations.sh"]
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────────
  # STUDIO — sur demande, et JAMAIS publié sur Internet.
  #
  #   docker compose --profile studio up -d studio
  #   ssh -L 54323:127.0.0.1:54323 mapoukam@<IP>   puis  http://localhost:54323
  # ───────────────────────────────────────────────────────────────────────────
  studio:
    profiles: ["studio"]
    image: ${IMAGE_STUDIO}
    depends_on:
      - passerelle
    environment:
      - STUDIO_PG_META_URL=http://meta:8080
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DEFAULT_ORGANIZATION_NAME=Édition Mapoukam
      - DEFAULT_PROJECT_NAME=editionmapoukam
      - SUPABASE_URL=http://passerelle:8000
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL}
      - SUPABASE_ANON_KEY=${ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY}
      - AUTH_JWT_SECRET=${JWT_SECRET}
    ports:
      - "127.0.0.1:54323:3000"
    restart: always

  meta:
    profiles: ["studio"]
    image: ${IMAGE_PG_META}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=db
      - PG_META_DB_PORT=5432
      - PG_META_DB_NAME=postgres
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD}
    restart: always

volumes:
  # La base. Le stockage. Les emails simulés. Rien d'autre n'a besoin de
  # survivre à un `docker compose down`.
  donnees-db:
  fichiers-storage:
  emails-simules:

networks: {}
