name: editionmapoukam

services:

  db:
    image: ${IMAGE_POSTGRES}
    restart: always
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - ./docker/db-init/01-roles.sql:/docker-entrypoint-initdb.d/init-scripts/98-roles.sql:ro
      - ./docker/db-init/02-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - donnees-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  auth:
    image: ${IMAGE_GOTRUE}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${APP_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_REDIRECTIONS_AUTORISEES}
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: ""

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTH_CONFIRMATION_AUTOMATIQUE:-false}
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${SUPABASE_PUBLIC_URL}/modeles-email/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${SUPABASE_PUBLIC_URL}/modeles-email/recovery.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirmez votre inscription — Édition Mapoukam"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Réinitialiser votre mot de passe — Édition Mapoukam"

      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: "Édition Mapoukam"
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "30"

      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"

      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"

      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_PAR_SUPABASE:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback

  rest:
    image: ${IMAGE_POSTGREST}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}

  storage:
    image: ${IMAGE_STORAGE}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: ${REGION}
      GLOBAL_S3_BUCKET: stub
      FILE_SIZE_LIMIT: "209715200"
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - fichiers-storage:/var/lib/storage

  imgproxy:
    image: ${IMAGE_IMGPROXY}
    restart: always
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - fichiers-storage:/var/lib/storage

  passerelle:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - auth
      - rest
      - storage
    volumes:
      - ./docker/passerelle.conf:/etc/nginx/conf.d/default.conf:ro
      - ./supabase/templates:/srv/modeles-email:ro
    ports:
      - "127.0.0.1:${PASSERELLE_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          - ${SUPABASE_ALIAS_INTERNE:-api.mapoukam.localhost}

  migrations:
    image: ${IMAGE_POSTGRES}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      storage:
        condition: service_started
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/appliquer-migrations.sh:/appliquer-migrations.sh:ro
    entrypoint: /bin/bash
    command: /appliquer-migrations.sh

  app:
    image: editionmapoukam/app:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${APP_PUBLIC_URL}
        NEXT_PUBLIC_DESIGN_VERSION: ${NEXT_PUBLIC_DESIGN_VERSION:-v3}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      passerelle:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${APP_PUBLIC_URL}
      NEXT_PUBLIC_DESIGN_VERSION: ${NEXT_PUBLIC_DESIGN_VERSION:-v3}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

      FAKE_WEBHOOK_SECRET: ${FAKE_WEBHOOK_SECRET}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY}
      NOTCHPAY_PRIVATE_KEY: ${NOTCHPAY_PRIVATE_KEY}
      NOTCHPAY_HASH_KEY: ${NOTCHPAY_HASH_KEY}
      NOTCHPAY_AUTORISER_PRODUCTION: ${NOTCHPAY_AUTORISER_PRODUCTION:-false}

      MAILER: ${MAILER:-file}
      MAIL_OUTPUT_DIR: /app/.mails
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}

      AUTH_GOOGLE: ${AUTH_GOOGLE:-desactive}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_CONFIRMATION_AUTOMATIQUE: ${AUTH_CONFIRMATION_AUTOMATIQUE:-false}

      SIGNED_URL_TTL: ${SIGNED_URL_TTL:-300}
      SIGNED_URL_TTL_FREE: ${SIGNED_URL_TTL_FREE:-3600}
      EXCERPT_PAGES_DEFAULT: ${EXCERPT_PAGES_DEFAULT:-3}
      ANON_PAGE_RATE_LIMIT: ${ANON_PAGE_RATE_LIMIT:-60}
      PAYMENT_GRACE_PERIOD_DAYS: ${PAYMENT_GRACE_PERIOD_DAYS}
      INVOICE_RETENTION_YEARS: ${INVOICE_RETENTION_YEARS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - emails-simules:/app/.mails
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  donnees-db:
  fichiers-storage:
  emails-simules:
